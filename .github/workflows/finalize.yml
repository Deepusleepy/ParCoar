name: Finalize ParCoar graph files

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/parcoar-simplify
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and commit tracked graph files
        shell: bash
        run: |
          set -euo pipefail
          python backend/generate_lot.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/lot.json frontend/public/lot.json
          git commit -m "chore: regenerate parking graph"
          git push origin HEAD:work/parcoar-simplify
