name: Finalize ParCoar branch

on: push

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/work/parcoar-simplify'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate tracked graph files and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          python backend/generate_lot.py

          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
            pull_request:

          jobs:
            frontend:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm
                    cache-dependency-path: frontend/package-lock.json
                - run: npm ci
                  working-directory: frontend
                - run: npm run build
                  working-directory: frontend
                - run: npm test
                  working-directory: frontend

            backend:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                - run: pip install -r backend/requirements.txt
                - run: python -m unittest discover -s tests -t . -v
                - run: python backend/generate_lot.py
                - run: git diff --exit-code shared/lot.json frontend/public/lot.json
          YAML

          rm .github/workflows/finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize generated graph and CI"
          git push origin HEAD
