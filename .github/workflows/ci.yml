name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Type check and production build. tsc runs with noUnusedLocals and
      # noUnusedParameters, so this catches dead code as well as type errors.
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -t . -v
      # The graph is generated, and both copies are committed. If regenerating
      # changes either of them, someone edited lot.json by hand or changed the
      # generator without re-running it.
      - run: python backend/generate_lot.py
      - run: git diff --exit-code shared/lot.json frontend/public/lot.json

# tests/simcheck is not run here. It needs a real browser, a live backend and
# a couple of minutes of simulated traffic, which is a different kind of job to
# a build check. Run it locally: node tests/simcheck/check.mjs
