name: Apply driving overhaul

on:
  push:
    branches:
      - work/driving-overhaul

permissions:
  contents: write

concurrency:
  group: apply-driving-overhaul
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/driving-overhaul
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/simcheck/package-lock.json

      - name: Apply source changes
        run: |
          python tools/driving_payload/apply_payload.py
          python backend/generate_lot.py

      - name: Backend tests
        run: |
          python -m pip install -r backend/requirements.txt
          python -m unittest discover -s tests -t . -v

      - name: Frontend build and tests
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          npm test --prefix frontend

      - name: Browser driving and POV test
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix tests/simcheck
          npx --prefix tests/simcheck playwright install --with-deps chromium
          VITE_PARCOAR_TEST=1 VITE_PARCOAR_TEST_MODE=drive npm run dev --prefix frontend -- --host 127.0.0.1 > /tmp/parcoar-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:5180/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5180/ >/dev/null || {
            cat /tmp/parcoar-vite.log
            exit 1
          }
          node tests/simcheck/player.mjs http://127.0.0.1:5180/ || {
            cat /tmp/parcoar-vite.log
            exit 1
          }

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md backend frontend shared tests
          git commit -m "feat: rebuild manual driving and POV mode"
          git push origin HEAD:work/driving-overhaul
