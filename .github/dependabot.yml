version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/tests/simcheck"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns: ["*"]
